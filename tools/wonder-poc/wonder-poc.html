<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wonder-poc — zero-tvm brain + block field</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #101014; color: #ece7df; font: 14px/1.5 system-ui, sans-serif; }
  .app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100dvh; }
  header { padding: 10px 14px; border-bottom: 1px solid #2a2a32; display: flex; gap: 10px; align-items: center; }
  header b { font-size: 15px; }
  #badge { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: #2a2a32; }
  #badge.ready { background: #1d4d2b; } #badge.error { background: #5d2222; }
  .ask { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2a2a32; }
  .ask input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #3a3a44; background: #17171c; color: inherit; }
  .ask button { padding: 9px 16px; border-radius: 8px; border: 0; background: #e8955a; color: #111; font-weight: 700; cursor: pointer; }
  .ask button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #view { position: relative; min-height: 0; }
  #view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: #9a958c; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 8px; }
  aside { border-left: 1px solid #2a2a32; display: flex; flex-direction: column; min-height: 0; }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: #9a958c; padding: 10px 12px 4px; }
  #out { flex: 1; overflow: auto; padding: 0 12px 12px; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  #log { max-height: 130px; overflow: auto; border-top: 1px solid #2a2a32; padding: 8px 12px; font-family: ui-monospace, monospace; font-size: 11.5px; color: #9a958c; }
  .chips { display: flex; gap: 6px; padding: 8px 14px; border-top: 1px solid #2a2a32; flex-wrap: wrap; }
  .chips button { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 1px solid #3a3a44; background: #17171c; color: inherit; cursor: pointer; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="app">
  <header><b>wonder-poc</b><span id="badge">booting…</span><span style="color:#9a958c;font-size:12px">zero-tvm brain → block field</span></header>
  <div class="ask">
    <input id="q" value="why does cheese melt?" maxlength="200">
    <button id="go" disabled>Build</button>
  </div>
  <main>
    <div id="view"><div id="hint">drag to orbit · scroll to zoom</div></div>
    <aside><h3>brain output</h3><div id="out">—</div><div id="log"></div></aside>
  </main>
  <div class="chips" id="chips"></div>
</div>

<script type="module" src="/wonder-poc-app.js"></script>
</body>
</html>
