<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240">
  <!-- Drawn in plan then squashed to the stage's perspective by the ellipse
       transform, so the ticks foreshorten like a floor marking should. -->
  <g transform="translate(300,120) scale(1,0.36)" fill="none" stroke="#fff">
    <circle r="252" stroke-width="3" opacity="0.9"/>
    <circle r="228" stroke-width="1.4" opacity="0.5"/>
    <circle r="180" stroke-width="1" opacity="0.28"/>
    <g stroke-width="2.4" opacity="0.85">
      <g id="t"><line x1="0" y1="-256" x2="0" y2="-238"/></g>
      <use href="#t" transform="rotate(30)"/><use href="#t" transform="rotate(60)"/>
      <use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(120)"/>
      <use href="#t" transform="rotate(150)"/><use href="#t" transform="rotate(180)"/>
      <use href="#t" transform="rotate(210)"/><use href="#t" transform="rotate(240)"/>
      <use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(300)"/>
      <use href="#t" transform="rotate(330)"/>
    </g>
    <g fill="#fff" stroke="none" opacity="0.95">
      <path id="d" d="M 0 -252 l 9 12 l -9 12 l -9 -12 Z"/>
      <use href="#d" transform="rotate(90)"/><use href="#d" transform="rotate(180)"/><use href="#d" transform="rotate(270)"/>
    </g>
  </g>
</svg>
