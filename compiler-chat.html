<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compiler Chat — Zero-TVM</title>
  <meta name="description" content="Compiler-based chat: captures TVM dispatches, then replays with 10 hand-written WGSL shaders.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Compiler Chat — Zero-TVM">
  <meta property="og:description" content="Compiler-based chat: captures TVM dispatches, then replays with 10 hand-written WGSL shaders.">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Match zero-tvm.html layout */
    body { height: 100vh; display: flex; flex-direction: column; }
    .container { flex: 1; display: flex; flex-direction: column; padding: 0; max-width: 100%; gap: 0; }
    header {
      padding: 0.75rem 1.25rem; border-bottom: 1px solid #1a1a1a;
      background: #0d0d0d; flex-shrink: 0;
    }
    header a { color: #555; transition: color 0.15s; }
    header a:hover { color: #aaa; }
    header h1 { font-size: 0.95rem; }
    .badge { background: #1a1a1a; color: #555; }
    .badge.loading { background: #332b00; color: #eab308; }
    .chat {
      flex: 1; overflow-y: auto; padding: 1rem 1.25rem;
      max-height: none; min-height: 0;
    }
    .chat > * { max-width: 720px; margin-left: auto; margin-right: auto; }
    .msg { max-width: 85%; }
    .msg.user { background: #1a2a3e; border-bottom-right-radius: 4px; }
    .msg.ai { background: #151515; border-bottom-left-radius: 4px; color: #bbb; }
    .input-row { border-top: 1px solid #1a1a1a; padding: 0.75rem 1.25rem; background: #0d0d0d; flex-shrink: 0; }
    .input-row input, .input-row button { max-width: 720px; }
    .log {
      max-height: 100px; font-size: 0.63rem; color: #2a2a2a;
      background: #0d0d0d; border-color: #151515; margin: 0 1.25rem 0.5rem;
      flex-shrink: 0;
    }
    footer { flex-shrink: 0; padding: 0.5rem; font-size: 0.65rem; color: #222; }
    footer a { color: #333; }
    /* Start screen */
    .start-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 1.25rem; text-align: center; }
    .start-screen .title { font-size: 1.1rem; font-weight: 600; color: #ccc; }
    .start-screen .desc { font-size: 0.85rem; color: #555; max-width: 380px; line-height: 1.6; }
    .start-btn {
      background: #10b981; color: #000; font-weight: 600; font-size: 0.95rem;
      padding: 0.7rem 2rem; border: none; border-radius: 8px; cursor: pointer;
    }
    .start-btn:hover { background: #34d399; }
    .start-btn:disabled { background: #1a1a1a; color: #444; cursor: default; }
    .start-hint { font-size: 0.68rem; color: #333; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/">&larr;</a>
      <h1>Compiler Chat</h1>
      <span id="badge" class="badge">Waiting</span>
      <span id="stats" class="stats"></span>
    </header>
    <div id="chat" class="chat">
      <div id="start-screen" class="start-screen">
        <div class="title">Compiler Chat</div>
        <div class="desc">
          Captures TVM dispatches on first message, then replays with 10 hand-written WGSL shaders.
        </div>
        <button id="start-btn" class="start-btn">Download & Start</button>
        <div class="start-hint">Downloads WebLLM + Phi-3 weights (~2 GB)</div>
      </div>
    </div>
    <div class="input-row">
      <input id="inp" type="text" placeholder="Type a message..." disabled>
      <button id="btn" disabled>Send</button>
    </div>
    <pre id="log" class="log"></pre>
  </div>
  <footer>
    <a href="/">zero-tvm</a> &middot; 342/342 dispatches = my shaders &middot; <a href="https://github.com/abgnydn/zero-tvm">GitHub</a>
  </footer>
  <script type="module" src="/src/compiler/chat-v2.ts"></script>
</body>
</html>
