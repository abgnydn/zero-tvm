<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Compiler — 342/342 Own Shaders</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <a href="/" style="color:#4caf50; text-decoration:none; font-size:0.85rem; font-weight:600;">&larr;</a>
      <h1>Compiler Chat</h1>
      <span id="badge" class="badge">Waiting</span>
      <span id="stats" class="stats"></span>
    </header>
    <div id="chat" class="chat">
      <div id="start-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:1rem; padding:2rem; text-align:center;">
        <p style="color:#888; font-size:0.95rem; max-width:400px;">
          Compiler-based chat: captures TVM dispatches on first message,<br>
          then replays with my 10 WGSL shaders.
        </p>
        <button id="start-btn" style="background:#4caf50; color:#000; font-weight:600; font-size:1rem; padding:0.75rem 2rem; border:none; border-radius:8px; cursor:pointer;">
          Download &amp; Start
        </button>
        <span style="font-size:0.72rem; color:#555;">Downloads WebLLM + Phi-3 weights (~2 GB).</span>
      </div>
    </div>
    <div class="input-row">
      <input id="inp" type="text" placeholder="Type a message..." disabled>
      <button id="btn" disabled>Send</button>
    </div>
    <pre id="log" class="log"></pre>
  </div>
  <footer>
    <a href="/" style="color:#4caf50; text-decoration:none;">zero-tvm</a> by Ahmet Baris Gunaydin
    &nbsp;&middot;&nbsp; <a href="https://github.com/abgnydn/zero-tvm" style="color:#555; text-decoration:none;">GitHub</a>
    &nbsp;&middot;&nbsp; 342/342 dispatches = my shaders.
  </footer>
  <script type="module" src="/src/compiler/chat-v2.ts"></script>
</body>
</html>
