<!doctype html><meta charset="utf-8"><title>model smoke probe</title>
<body style="font:13px ui-monospace,monospace;padding:1rem"><pre id="log">…</pre>
<script type="module">
// MODEL SMOKE — dev-only probe scripts/validate-model.mjs drives: boots the
// chat-config engine for ?model=<param> (registry-resolved, so a generated
// spec is reachable the moment add-model registers it) and exposes
// window.__forward / window.__generate for the node side to diff against
// mlx_lm's reference dump. Not in the Vite build graph; vite dev serves it.
const L=[],el=document.getElementById('log')
const say=(...a)=>{L.push(a.join(' '));el.textContent=L.slice(-60).join('\n');console.log('[T]',a.join(' '))}
window.__phase='boot'; window.__done=false
try{
  const { specFromSearch } = await import('/src/zero-tvm/model-select.ts')
  const { compile } = await import('/src/compiler/compiler.ts')
  const { loadWeights } = await import('/src/zero-tvm/weight-loader.ts')
  const { buildDecodeEngine, allocKVPages } = await import('/src/zero-tvm/engine-core.ts')
  const { SCALAR_VARIANTS } = await import('/src/zero-tvm/variants.ts')
  const S = specFromSearch(location.search)
  say('spec:', S.id, '| format:', S.weightFormat ?? 'mlc')

  const ad = await navigator.gpu.requestAdapter({ powerPreference:'high-performance' })
  const feats = [...ad.features].filter(f=>/shader-f16|subgroups/.test(f))
  const dev = await ad.requestDevice({ requiredFeatures: feats, requiredLimits: {
    maxBufferSize: ad.limits.maxBufferSize,
    maxStorageBufferBindingSize: ad.limits.maxStorageBufferBindingSize,
  }})
  let gpuErrs = 0
  dev.addEventListener('uncapturederror', e => { gpuErrs++; say('GPU ERROR:', e.error.message.split('\n')[0]) })
  window.__gpuErrs = () => gpuErrs

  const t0 = performance.now()
  let wholeBytes = 0
  const weights = await loadWeights(dev, m => { if(/ready|headers|shard/.test(m)) say(m) },
    (st) => { wholeBytes = st.bytesLoaded }, S)
  window.__wholeBytes = () => wholeBytes
  say(`weights ok in ${((performance.now()-t0)/1000).toFixed(0)}s`)
  const kv = allocKVPages(dev, S)
  // Chat-shaped composition: subgroups + tiled matmul (what users actually
  // run); fused stays off — engine-core forces unfused for qkNorm/affine.
  const engine = buildDecodeEngine(dev, weights, kv, {
    spec: S, variants: { ...SCALAR_VARIANTS, subgroups:true, matmul:'tiled' },
  })
  say('engine built')

  // Split the SAME weights into two pipeline stages and drive them by hand.
  // Both stages live on this one device — the point is the numerics, not the
  // transport: if A(0..k) + B(k..N) does not reproduce the whole model's
  // tokens, no amount of WebRTC will fix it.
  // `v` overrides the variant set. It matters: the default here is a scalar
  // kernel set the app does not ship, so a split proven exact with it says
  // nothing about the split the app actually runs.
  window.__splitCheck = async (ids, k, n, v) => {
    const V = { ...SCALAR_VARIANTS, subgroups:true, matmul:'tiled', ...(v || {}) }
    const A = buildDecodeEngine(dev, weights, allocKVPages(dev, S), {
      spec: S, variants: V, layerRange: { start: 0, end: k },
    })
    const B = buildDecodeEngine(dev, weights, allocKVPages(dev, S), {
      spec: S, variants: V, layerRange: { start: k, end: S.layers },
    })
    const step = async (tokenId, pos) => {
      const mid = await A.pipelineStep({ tokenId }, pos)
      return (await B.pipelineStep({ residual: mid.residual }, pos)).tokenId
    }
    // Prefill the prompt one position at a time; the last one yields token #1.
    let tok = 0
    for (let i = 0; i < ids.length; i++) tok = await step(ids[i], i)
    const out = [tok]
    for (let i = 1; i < n; i++) out.push(tok = await step(tok, ids.length + i - 1))
    return out
  }

  // N stages, not two. The room protocol only pairs a host with one helper,
  // but the engine takes any layer range, so the numerics of a 6-way chain can
  // be settled here before any of that gets built. `cuts` are the interior
  // boundaries: [6,12,18] over 24 layers means 4 stages.
  window.__chainCheck = async (ids, cuts, n, v) => {
    const V = { ...SCALAR_VARIANTS, subgroups:true, matmul:'tiled', ...(v || {}) }
    const bounds = [0, ...cuts, S.layers]
    const stages = bounds.slice(0, -1).map((start, i) => buildDecodeEngine(dev, weights, allocKVPages(dev, S), {
      spec: S, variants: V, layerRange: { start, end: bounds[i + 1] },
    }))
    const step = async (tokenId, pos) => {
      let carry = await stages[0].pipelineStep({ tokenId }, pos)
      for (let i = 1; i < stages.length; i++) {
        carry = await stages[i].pipelineStep({ residual: carry.residual }, pos)
      }
      return carry.tokenId
    }
    let tok = 0
    for (let i = 0; i < ids.length; i++) tok = await step(ids[i], i)
    const out = [tok]
    const t0 = performance.now()
    for (let i = 1; i < n; i++) out.push(tok = await step(tok, ids.length + i - 1))
    return { tokens: out, msPerToken: (performance.now() - t0) / (n - 1), stages: stages.length }
  }

  // Same split, but each stage LOADS ONLY ITS OWN LAYERS — the arrangement a
  // real two-machine run uses. Reports the bytes each stage actually holds.
  window.__splitLoadCheck = async (ids, k, n) => {
    const V = { ...SCALAR_VARIANTS, subgroups:true, matmul:'tiled' }
    const mk = async (start, end) => {
      let bytes = 0
      const w = await loadWeights(dev, undefined, (s) => { bytes = s.bytesLoaded }, S, { start, end })
      const e = buildDecodeEngine(dev, w, allocKVPages(dev, S), { spec: S, variants: V, layerRange: { start, end } })
      return { e, bytes }
    }
    const A = await mk(0, k)
    const B = await mk(k, S.layers)
    const step = async (tokenId, pos) => {
      const mid = await A.e.pipelineStep({ tokenId }, pos)
      return (await B.e.pipelineStep({ residual: mid.residual }, pos)).tokenId
    }
    let tok = 0
    for (let i = 0; i < ids.length; i++) tok = await step(ids[i], i)
    const out = [tok]
    for (let i = 1; i < n; i++) out.push(tok = await step(tok, ids.length + i - 1))
    return { tokens: out, bytesA: A.bytes, bytesB: B.bytes }
  }

  // The whole model under an ARBITRARY variant set — the control for
  // __splitCheck(v). Without it, "the split forks under app variants" cannot
  // be told apart from "app variants fork, split or not".
  window.__wholeCheck = async (ids, n, v) => {
    const e = buildDecodeEngine(dev, weights, allocKVPages(dev, S), {
      spec: S, variants: { ...SCALAR_VARIANTS, subgroups:true, matmul:'tiled', ...(v || {}) },
    })
    return Array.from(await e.generate(ids, 0, n, () => {}))
  }
  window.__forward = async (ids) => Array.from(await engine.forwardLogits(ids))
  window.__generate = async (ids, n) => {
    const out = await engine.generate(ids, 0, n, () => {})
    return Array.from(out)
  }
  // The path share.ts uses to serve a WHOLE model. It differs from generate()
  // in one way that matters to anyone comparing sequences: chunked prefill.
  // A split model cannot use it (a stage holds only some layers and prefills
  // one position at a time), so this is what a whole-vs-split text diff is
  // really comparing against.
  window.__generatePipelined = async (ids, n) => {
    const out = []
    await engine.generatePipelined(ids, n, (t) => out.push(t), () => false)
    return out
  }
  window.__phase='loaded'
}catch(e){
  say('ERROR:', e && e.stack ? e.stack.split('\n').slice(0,4).join(' | ') : String(e))
  window.__phase='error'; window.__error=String(e && e.message || e)
}
window.__done=true
</script>
