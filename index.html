<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private AI Chat — Powered by Kernel Fusion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 1rem 2rem; background: #111; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 1rem; }
    header h1 { font-size: 1.2rem; color: #fff; }
    .badge { background: #1a472a; color: #4caf50; padding: 0.25rem 0.75rem; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge.loading { background: #3a3a00; color: #ffd54f; }
    #stats { margin-left: auto; font-size: 0.8rem; color: #666; font-family: monospace; }
    #log { padding: 0.5rem 2rem; font-family: monospace; font-size: 0.6rem; color: #444; background: #0d0d0d; max-height: 60px; overflow-y: auto; border-bottom: 1px solid #1a1a1a; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem 2rem; }
    .msg { margin-bottom: 1rem; max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; font-size: 0.95rem; }
    .msg.user { background: #1a3a5c; margin-left: auto; border-bottom-right-radius: 4px; }
    .msg.ai { background: #1a1a1a; border-bottom-left-radius: 4px; }
    #bar { padding: 1rem 2rem; background: #111; border-top: 1px solid #222; display: flex; gap: 0.75rem; }
    #bar input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 0.75rem 1rem; border-radius: 8px; font-size: 1rem; outline: none; }
    #bar input:focus { border-color: #1a73e8; }
    #bar input:disabled { opacity: 0.5; }
    #bar button { background: #1a73e8; color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    #bar button:disabled { background: #333; cursor: not-allowed; }
    .note { text-align: center; padding: 0.5rem; font-size: 0.7rem; color: #444; }
  </style>
</head>
<body>
  <header>
    <h1>Private AI Chat</h1>
    <span class="badge loading" id="badge">Loading...</span>
    <span id="stats"></span>
  </header>
  <div id="log"></div>
  <div id="chat"><div class="msg ai">Downloading model to your browser...</div></div>
  <div id="bar">
    <input id="inp" placeholder="Type a message..." disabled>
    <button id="btn" disabled>Send</button>
  </div>
  <div class="note">100% local GPU inference via WebGPU. Zero server requests during chat.</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
