<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero TVM — Pure WGSL Phi-3</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Zero TVM</h1>
      <span id="badge" class="badge loading">Loading...</span>
      <span id="stats" class="stats"></span>
    </header>
    <div id="chat" class="chat"></div>
    <div class="input-row">
      <input id="inp" type="text" placeholder="Type a message..." disabled>
      <button id="btn" disabled>Send</button>
    </div>
    <pre id="log" class="log"></pre>
  </div>
  <footer>Zero WebLLM. Zero TVM. 10 WGSL shaders. Weights from HuggingFace cache.</footer>
  <script type="module" src="/src/zero-tvm/chat.ts"></script>
</body>
</html>
