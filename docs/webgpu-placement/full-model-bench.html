<!doctype html><meta charset="utf-8"><title>full model vs isolated Scan</title>
<body><pre id="log">…</pre>
<script type="module">
import * as ort from '/ort-dist126/ort.webgpu.bundle.min.mjs';
const L=[];const say=(...a)=>{L.push(a.join(' '));document.getElementById('log').textContent=L.join('\n');console.log('[T]',a.join(' '))};
window.__done=false;
ort.env.wasm.wasmPaths='/ort-dist126/'; ort.env.wasm.numThreads=1; ort.env.logLevel='error';
const S=252,H=32,DK=128,DV=128,HID=2560;
const f32=(d)=>new ort.Tensor('float32',new Float32Array(d.reduce((a,b)=>a*b,1)).fill(0.02),d);
const f16=(d)=>new ort.Tensor('float16',new Uint16Array(d.reduce((a,b)=>a*b,1)),d);   // zeros
const i64=(d,fill)=>{const n=d.reduce((a,b)=>a*b,1);const a=new BigInt64Array(n);
  if(fill==='pos'){const s=d[d.length-1];for(let i=0;i<n;i++)a[i]=BigInt(i%s)}else a.fill(1n);
  return new ort.Tensor('int64',a,d)};
try{
  // ---------- A. isolated Scan (one layer) ----------
  const sc=await ort.InferenceSession.create('/real_scan.onnx',{executionProviders:['webgpu']});
  const N0=parseInt(new URLSearchParams(location.search).get('s')||'252');
  const sf={state0:f32([1,H,DK,DV]),q:f32([1,H,N0,DK]),k:f32([1,H,N0,DK]),v:f32([1,H,N0,DV]),beta:f32([1,H,N0]),g:f32([1,H,N0])};
  await sc.run(sf);
  let ts=[];for(let r=0;r<3;r++){const t=performance.now();await sc.run(sf);ts.push(performance.now()-t)}
  ts.sort((a,b)=>a-b);const scanOne=ts[1];
  say(`A. isolated Scan, 1 layer, ${N0} pos : ${scanOne.toFixed(0)} ms`);
  say(`   x24 layers                      : ${(scanOne*24/1000).toFixed(2)} s`);

  // ---------- B. full decoder ----------
  say('loading full decoder (~2.5 GB)…');
  const t0=performance.now();
  const sess=await ort.InferenceSession.create('/weights/decoder_model_merged_q4f16.onnx',{
    executionProviders:['webgpu'],
    externalData:[{path:'decoder_model_merged_q4f16.onnx_data',data:'/weights/decoder_model_merged_q4f16.onnx_data'},
                  {path:'decoder_model_merged_q4f16.onnx_data_1',data:'/weights/decoder_model_merged_q4f16.onnx_data_1'}],
  });
  say(`   session created in ${((performance.now()-t0)/1000).toFixed(1)} s`);
  const Q=new URLSearchParams(location.search); const N=parseInt(Q.get('s')||'252');
  const mkFeeds=(n_)=>{const f={inputs_embeds:f32([1,n_,HID]),attention_mask:i64([1,n_]),position_ids:i64([3,1,n_],'pos')};
    for(const n of sess.inputNames){
      if(n.startsWith('past_conv')) f[n]=f16([1,8192,4]);
      else if(n.startsWith('past_recurrent')) f[n]=f16([1,H,DK,DV]);
      else if(n.startsWith('past_key_values')) f[n]=f16([1,4,0,256]);
    } return f};
  const fd=mkFeeds(N);
  const chk=await sess.run(fd);
  say(`   sanity: logits dims ${JSON.stringify(chk.logits.dims)}`);
  const t2=[]; for(let r=0;r<3;r++){const t=performance.now();await sess.run(fd);t2.push(performance.now()-t)}
  t2.sort((a,b)=>a-b); const full=t2[1];
  say('');
  say(`B. FULL prefill S=${N} : ${(full/1000).toFixed(2)} s   (runs ${t2.map(x=>(x/1000).toFixed(2)).join(', ')})`);
  say(`RESULT s=${N} scan1=${scanOne.toFixed(1)} full=${full.toFixed(1)}`);
}catch(e){say('ERROR:',e&&e.message?e.message:String(e))}
window.__done=true;
</script>
