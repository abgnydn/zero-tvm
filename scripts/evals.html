<!doctype html>
<meta charset="utf-8">
<title>zero-tvm · evals</title>
<style>
  :root {
    --bg:#0e0f12; --panel:#16181d; --line:#24272f; --fg:#e6e8ee; --dim:#8b93a5;
    --pass:#3fb950; --fail:#f85149; --hollow:#d29922; --unrun:#484f5c; --acc:#58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:baseline; gap:14px; position:sticky; top:0; background:var(--bg); z-index:5 }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.2px }
  .sub { color:var(--dim); font-size:12px }
  main { display:grid; grid-template-columns: minmax(420px, 1fr) minmax(420px, 1fr); gap:0; height:calc(100vh - 51px) }
  .col { overflow-y:auto; padding:14px 18px }
  .col + .col { border-left:1px solid var(--line) }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:var(--dim);
       margin:18px 0 8px; font-weight:600 }
  h2:first-child { margin-top:0 }

  .check { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; background:var(--panel) }
  .head { display:flex; align-items:center; gap:10px; padding:10px 12px; cursor:pointer }
  .head:hover { background:#1b1e25 }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--unrun); flex:none }
  .dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)}
  .dot.hollow{background:var(--hollow)} .dot.killed{background:var(--unrun)}
  .nm { font-weight:600; flex:1 }
  .badge { font:11px/1 var(--mono); padding:3px 6px; border-radius:4px; border:1px solid var(--line); color:var(--dim) }
  .badge.gpu{ color:#d2a8ff; border-color:#3d2f52 }
  .badge.model{ color:#ffa657; border-color:#553a24 }
  .last { font:11px var(--mono); color:var(--dim) }

  .body { display:none; padding:0 12px 12px; border-top:1px solid var(--line) }
  .check.open .body { display:block }
  .proves { margin:10px 0 6px }
  .why, .note { color:var(--dim); font-size:12.5px; margin:4px 0 }
  .gap { color:var(--hollow); font-size:12.5px; margin:6px 0; padding-left:9px; border-left:2px solid var(--hollow) }
  .warn { color:var(--fail); font-size:12.5px; margin:6px 0; padding-left:9px; border-left:2px solid var(--fail) }

  .covers { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 }
  .ax { font:11px var(--mono); padding:3px 7px; border-radius:4px; background:#1c2029; border:1px solid var(--line) }
  .ax b { color:var(--acc); font-weight:600 }
  .uncov { font:11px var(--mono); color:var(--dim); padding:3px 7px; border:1px dashed var(--line); border-radius:4px }

  .args { display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; margin:10px 0 }
  .args label { font:11px var(--mono); color:var(--dim); text-align:right }
  .args input, .args select { background:#0b0d10; color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:5px 7px; font:12px var(--mono); width:100% }
  .argwhy { grid-column:2; font-size:11px; color:var(--dim); margin-top:-4px }

  .cmd { font:11.5px var(--mono); background:#0b0d10; border:1px solid var(--line); color:var(--dim);
         padding:7px 9px; border-radius:5px; overflow-x:auto; white-space:pre; margin:8px 0 }
  button { background:var(--acc); color:#04121f; border:0; border-radius:6px; padding:7px 14px;
           font-weight:600; cursor:pointer; font-size:13px }
  button:disabled { background:#2a2f3a; color:var(--dim); cursor:not-allowed }
  button.ghost { background:transparent; color:var(--dim); border:1px solid var(--line) }

  #log { font:11.5px/1.55 var(--mono); white-space:pre-wrap; word-break:break-word }
  #log .err { color:#ffa198 }
  #log .meta { color:var(--acc) }
  .runbar { display:flex; align-items:center; gap:10px; margin-bottom:10px;
            padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel) }
  .spin { width:9px; height:9px; border-radius:50%; background:var(--acc); animation:p 1s infinite }
  @keyframes p { 0%,100%{opacity:.25} 50%{opacity:1} }
  .legend { display:flex; gap:14px; font-size:11px; color:var(--dim); margin-bottom:12px; flex-wrap:wrap }
  .legend span { display:flex; align-items:center; gap:5px }
</style>

<header>
  <h1>zero-tvm · evals</h1>
  <span class="sub" id="tally">loading…</span>
</header>

<main>
  <div class="col" id="left"></div>
  <div class="col">
    <div class="runbar" id="runbar"><span class="sub">nothing running</span></div>
    <div id="log"></div>
  </div>
</main>

<script type="module">
const $ = (s, r = document) => r.querySelector(s)
const el = (t, c, x) => { const n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n }

let DATA = null

const AGE = (ms) => {
  const s = (Date.now() - ms) / 1000
  if (s < 90) return `${s | 0}s ago`
  if (s < 5400) return `${(s / 60) | 0}m ago`
  if (s < 172800) return `${(s / 3600) | 0}h ago`
  return `${(s / 86400) | 0}d ago`
}
const DUR = (ms) => ms < 1000 ? `${ms}ms` : ms < 90000 ? `${(ms / 1000).toFixed(1)}s` : `${(ms / 60000).toFixed(1)}m`

async function load() {
  DATA = await (await fetch('/api/checks')).json()
  render()
}

function render() {
  const left = $('#left'); left.innerHTML = ''
  const groups = { static: 'runs anywhere', kernels: 'needs a GPU', eval: 'evals — catch “fluent but wrong”' }

  const counts = { pass: 0, fail: 0, hollow: 0, unrun: 0 }
  for (const c of DATA.checks) counts[c.last?.verdict === 'killed' ? 'unrun' : (c.last?.verdict ?? 'unrun')]++

  $('#tally').textContent =
    `${DATA.checks.length} checks · ${counts.pass} pass · ${counts.fail} fail · ${counts.hollow} hollow · ${counts.unrun} never run here`

  const legend = el('div', 'legend')
  for (const [k, t] of [['pass', 'verified'], ['fail', 'failed'], ['hollow', 'exited 0 having verified nothing'], ['unrun', 'no run on record']]) {
    const s = el('span'); s.append(Object.assign(el('i', `dot ${k}`), { style: 'display:inline-block' }), el('span', null, t)); legend.append(s)
  }
  left.append(legend)

  for (const [g, title] of Object.entries(groups)) {
    const rows = DATA.checks.filter((c) => c.group === g)
    if (!rows.length) continue
    left.append(el('h2', null, title))
    for (const c of rows) left.append(card(c))
  }
}

function card(c) {
  const v = c.last?.verdict ?? 'unrun'
  const box = el('div', 'check')
  const head = el('div', 'head')
  head.append(el('i', `dot ${v}`), el('span', 'nm', c.name))
  if (c.needs !== 'none') head.append(el('span', `badge ${c.needs}`, c.needs))
  head.append(el('span', 'last', c.last
    ? `${v} · ${DUR(c.last.ms)} · ${AGE(c.last.started)}`
    : 'never run here'))
  head.onclick = () => box.classList.toggle('open')
  box.append(head)

  const b = el('div', 'body')
  b.append(el('div', 'proves', c.proves))
  if (c.why) b.append(el('div', 'why', c.why))
  if (c.note) b.append(el('div', 'note', `note: ${c.note}`))
  if (c.warn) b.append(el('div', 'warn', `⚠ ${c.warn}`))

  // Coverage — the box this check runs in. An axis not listed is UNCOVERED,
  // which is the whole point: a check green at six tokens covers six tokens.
  const cov = el('div', 'covers')
  const axes = Object.entries(c.covers ?? {})
  if (axes.length) for (const [k, val] of axes) {
    const a = el('span', 'ax'); a.append(el('b', null, k + ' '), document.createTextNode(String(val))); cov.append(a)
  }
  for (const k of ['spec', 'tokens', 'cap', 'gemm']) {
    if (!(k in (c.covers ?? {}))) cov.append(el('span', 'uncov', `${k}: uncovered`))
  }
  b.append(cov)
  if (c.gap) b.append(el('div', 'gap', c.gap))

  // Args
  const vals = {}
  if (c.args?.length) {
    const grid = el('div', 'args')
    for (const a of c.args) {
      const id = `${c.id}-${a.name}`
      grid.append(el('label', null, a.name))
      let inp
      if (a.kind === 'param') {
        inp = el('select')
        for (const p of DATA.params) { const o = el('option', null, p); o.value = p; if (p === a.default) o.selected = true; inp.append(o) }
      } else if (a.kind === 'flag') {
        inp = el('input'); inp.type = 'checkbox'; inp.checked = !!a.default
      } else {
        inp = el('input'); inp.type = a.kind === 'int' ? 'number' : 'text'; inp.value = a.default
      }
      inp.id = id
      inp.oninput = () => { vals[a.name] = a.kind === 'flag' ? inp.checked : inp.value; preview() }
      vals[a.name] = a.kind === 'flag' ? inp.checked : inp.value
      grid.append(inp)
      if (a.why) grid.append(el('div', 'argwhy', a.why))
    }
    b.append(grid)
  }

  const cmd = el('div', 'cmd', c.preview)
  b.append(cmd)
  function preview() { cmd.textContent = c.preview } // server owns exact resolution

  const btn = el('button', null, 'Run')
  btn.onclick = async () => {
    btn.disabled = true
    const r = await fetch('/api/run', { method: 'POST', body: JSON.stringify({ id: c.id, values: vals }) })
    if (!r.ok) { const e = await r.json(); alert(e.error); btn.disabled = false }
  }
  const row = el('div'); row.style.display = 'flex'; row.style.gap = '8px'
  row.append(btn)
  if (c.last) {
    const lg = el('button', 'ghost', 'last log')
    lg.onclick = async () => {
      const t = await (await fetch(`/api/log?id=${c.id}`)).text()
      showLog(`— last run of ${c.name} —`, t)
    }
    row.append(lg)
  }
  b.append(row)
  box.append(b)
  return box
}

function showLog(header, text) {
  const log = $('#log'); log.innerHTML = ''
  log.append(el('div', 'meta', header))
  log.append(document.createTextNode(text))
}

// ── live stream ────────────────────────────────────────────────────────────
const log = $('#log')
let lines = 0
const es = new EventSource('/api/stream')
es.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'start') {
    lines = 0; log.innerHTML = ''
    const bar = $('#runbar'); bar.innerHTML = ''
    bar.append(el('i', 'spin'), el('span', 'nm', m.id))
    const kill = el('button', 'ghost', 'kill')
    kill.onclick = () => fetch('/api/kill', { method: 'POST' })
    const t0 = m.started
    const tick = el('span', 'last', '0s')
    bar.append(tick, kill)
    bar.dataset.timer = setInterval(() => { tick.textContent = DUR(Date.now() - t0) }, 1000)
    log.append(el('div', 'meta', `$ ${m.cmd.join(' ')}`))
    log.append(el('div', 'meta', `  cwd ${m.cwd}`))
    if (Object.keys(m.values ?? {}).length) log.append(el('div', 'meta', `  ${JSON.stringify(m.values)}`))
    log.append(document.createTextNode('\n'))
  }
  if (m.type === 'line') {
    lines++
    const n = el('div', m.stream === 'err' ? 'err' : null, m.line)
    log.append(n)
    if (lines % 3 === 0) n.scrollIntoView({ block: 'end' })
  }
  if (m.type === 'end') {
    clearInterval(Number($('#runbar').dataset.timer))
    const verdictText = {
      pass: 'PASS', fail: `FAIL (exit ${m.code})`,
      hollow: `HOLLOW — exit 0, ${m.skipped} skipped, 0 passed. It verified nothing.`,
      killed: 'killed',
    }[m.verdict]
    log.append(el('div', 'meta', `\n${verdictText} · ${DUR(m.ms)} · ${m.passed} pass / ${m.failed} fail / ${m.skipped} skip`))
    $('#runbar').innerHTML = `<span class="sub">nothing running</span>`
    load()
  }
}
load()
</script>
